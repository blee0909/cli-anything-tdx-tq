[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-tdx-tq"
version = "1.1.0"
description = "TDX TQ SDK CLI - 通达信量化接口命令行工具 (基于 TQ 策略模式)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Jin" }
]
keywords = ["tdx", "通达信", "量化", "trading", "stock", "finance", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cli-anything-tdx-tq = "cli_anything.tdx_tq.tdx_tq_cli:main"
tdx-tq = "cli_anything.tdx_tq.tdx_tq_cli:main"

[tool.setuptools.packages.find]
include = ["cli_anything*"]

[tool.pytest.ini_options]
testpaths = ["cli_anything/tdx_tq/tests"]
python_files = ["test_*.py"]
