[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-tdx-tq"
dynamic = ["version"]
description = "通达信 TQ SDK 命令行工具"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jin" }]
keywords = ["tdx", "通达信", "trading", "stock", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = ["click>=8.0", "pandas>=2.2", "numpy>=1.26", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=7"]

[project.scripts]
cli-anything-tdx-tq = "cli_anything.tdx_tq.tdx_tq_cli:main"
tdx-tq = "cli_anything.tdx_tq.tdx_tq_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "cli_anything.tdx_tq.__version__"}

[tool.setuptools.packages.find]
include = ["cli_anything*"]
exclude = ["cli_anything.tdx_tq.tests*"]

[tool.setuptools.package-data]
"cli_anything.tdx_tq" = ["skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["cli_anything/tdx_tq/tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = ["live: read-only tests requiring an explicitly enabled TDX client"]

[tool.coverage.run]
branch = true
source = ["cli_anything/tdx_tq"]
omit = ["*/tests/*"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.uv]
environments = ["sys_platform == 'win32'"]
